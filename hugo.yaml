baseURL: https://nazprime.com/
enableRobotsTXT: true
locale: en-us
title: nazprime
taxonomies:
  tag: tags
menus:
  main:
  - name: Projects
    pageRef: /projects
    weight: 10
  - name: Lab
    pageRef: /lab
    weight: 20
  - name: Notes
    pageRef: /notes
    weight: 30
  - name: Now
    pageRef: /now
    weight: 40
  - name: About
    pageRef: /about
    weight: 50
markup:
  goldmark:
    renderHooks:
      image:
        useEmbedded: always
  highlight:
    noClasses: false
build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json
security:
  exec:
    allow:
    - ^(dart-)?sass$
    - ^go$
    - ^git$
    - ^node$
    - ^postcss$
    - ^tailwindcss$
