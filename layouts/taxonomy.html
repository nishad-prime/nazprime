{{ define "main" }}
<div class="mx-auto w-full max-w-3xl px-5 sm:px-6">
  <header class="pb-10 pt-14 sm:pb-12 sm:pt-20">
    <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">{{ .Title }}</h1>
  </header>
  <ul>
    {{ range .Data.Terms.Alphabetical }}
    <li class="flex items-baseline justify-between gap-4 border-t border-rule py-3 last:border-b">
      <a href="{{ .Page.RelPermalink }}" class="font-medium text-ink underline decoration-rule underline-offset-4 transition-colors duration-150 hover:decoration-accent">{{ .Page.LinkTitle }}</a>
      <span class="font-mono text-sm text-muted">{{ .Count }}</span>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
